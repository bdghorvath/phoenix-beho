[settings]
# --- Model and Training Configuration ---

# Visualization
viz = True             # Controls whether to enable visualization (e.g., training plots). [Range: True or False]
log_scale = linear     # The scale type for logging/plotting (usually for data or loss). [Alternatives: log]
scale_expression = 1   # A scaling factor applied to the expression/output values. [Alternatives: 10, 100]

# Network Architecture
neurons_per_layer = 40 # Sets the width of the hidden layers in the neural network. [Range: 32, 64, 128, 256]
pretrained_model = False # Flag to specify if a pre-trained model should be loaded. [Range: True or False]

# Optimization and Learning
optimizer = adam       # The optimization algorithm used for training. [Alternatives: sgd, rmsprop]
init_lr = 5e-4         # The starting learning rate. [Range: 1e-5 to 1e-2]
dec_lr = False         # Flag to enable learning rate decay (scheduling). [Range: True or False]
dec_lr_factor = 0.995  # The multiplicative factor for learning rate decay per epoch/step. [Range: 0.95 to 0.999]
weight_decay = 0       # L2 regularization strength to prevent overfitting. [Alternatives: 1e-4, 1e-5]
epochs = 100           # The number of full passes over the training data. [Range: 50, 200, 500]

# Data Handling
batch_size = 17        # The number of samples processed before the model's parameters are updated. [Range: 16, 32, 64, 128]
batch_type = single    # Defines how the data is batched (e.g., a single data point per batch). [Alternatives: random, sequential]
val_split = 0.04       # The fraction of data reserved for validation. [Range: 0.01 to 0.2]
normalize_data = False # Flag to enable data normalization (e.g., standard scaling). [Range: True or False]
noise = 0              # The level of random noise added to the input or training process. [Alternatives: 0.01, 0.05]

# Environment and Method
method = dopri5        # Specifies the ODE solver method to use. [Alternatives: rk4, bdf, adams]
cpu = True             # Flag to force training on the CPU instead of the GPU. [Range: True or False]

# Debugging
debug = False          # Debug mode flag
output_dir = output    # Directory where results are saved
verbose = True         # Controls progress bar output

#additional hyperparameters that gemini wants to add
# Missing Data Handling Settings
batch_time = 12        # Number of time steps per batch. [Adjust if needed]
batch_time_frac = 0.5  # Fraction of time points to use. [Range: 0.0 to 1.0]

# Missing Training Settings
explicit_time = False  # Include time explicitly in input? [Range: True or False]
relative_error = False # Use relative error for loss? [Range: True or False]